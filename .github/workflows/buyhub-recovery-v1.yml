name: BuyHub Recovery V1 QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  recovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full recovery gate
        run: npm run qa:recovery
